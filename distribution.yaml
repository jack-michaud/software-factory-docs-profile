name: softwarefactorydocs
version: 0.1.0
status: published-profile
purpose: Maintain and deploy public Software Factory documentation and release notes from approved, public-safe release handoff artifacts.
least_privilege: true
publication_status: published_profile_distribution
role_capability_manifest: role-capability-manifest.yaml
source:
  type: monorepo-generated
  monorepo: software-factory-profiles
  role: docs
  generated_repo: hermes-softwarefactorydocs-profile
allowed_toolsets:
  - file
  - web
  - search
  - kanban
  - skills
validation_capabilities:
  optional_toolsets:
    - terminal
  purpose: Run local static validation scripts in an isolated workspace and checkpointed dedicated docs-site deployments only when explicitly task-scoped.
recommended_skills:
  - public-docs-maintenance
templates:
  - templates/release-packet.md
  - templates/release-notes.md
  - templates/redaction-checklist.md
  - templates/docs-freshness-checklist.md
  - templates/profile-distribution-docs-update-checklist.md
  - templates/role-capability-readiness-checklist.md
explicitly_excluded_authority:
  - unrelated-sprite-create-deploy-checkpoint-mutate
  - broad-fly-infrastructure-mutation
  - pi-sprite-mutation
  - pi-orchestrator-mutation
  - production-profile-distribution-publication
  - raw-kanban-database-access
  - private-memory-session-log-access
  - credential-or-secret-access
required_publication_gate: Dedicated docs sprite/site deployment is allowed only when the task requests deployment and identifies a target explicitly or SOFTWARE_FACTORY_DOCS_SPRITE_NAME is present; otherwise produce a docs handoff or block on ambiguity.
env_requires:
  - name: SOFTWARE_FACTORY_DOCS_SPRITE_NAME
    description: "Optional dedicated Software Factory docs sprite name to publish/update when a task requests deployed docs; set to hermes-sf-docs for this environment."
    required: false
    default: ""
distribution_owned:
  - README.md
  - SOUL.md
  - config.yaml
  - LICENSE
  - RELEASE_NOTES.md
  - EXCLUSIONS.md
  - distribution.yaml
  - role-capability-manifest.yaml
  - skills/public-docs-maintenance/
  - templates/release-packet.md
  - templates/release-notes.md
  - templates/redaction-checklist.md
  - templates/docs-freshness-checklist.md
  - templates/profile-distribution-docs-update-checklist.md
  - templates/role-capability-readiness-checklist.md
  - scripts/validate_public_safety.py
  - scripts/validate_capability_manifest.py
